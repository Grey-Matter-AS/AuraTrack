name: Hub packages

# Builds the hub for each system as one downloadable folder, and as a single executable (Node's single-executable feature),
# so a household without Node can run it. Run by hand from the Actions tab, or when a tag like hub-7.1.0 is pushed.
on:
  workflow_dispatch:
  push:
    tags: ['hub-*']

permissions:
  contents: read

jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @auratrack/tray build
      - run: pnpm --filter @auratrack/server package
      - name: Single executable
        run: pnpm --filter @auratrack/server sea
      - uses: actions/upload-artifact@v4
        with:
          name: auratrack-hub-${{ matrix.os }}
          path: apps/server/dist/package/
